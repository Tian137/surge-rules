# Mihomo config template for Sparkle (via Sub-Store).
# Node list is injected at download time by Sub-Store from the Sparkle collection.
# Do not put node credentials in this file.

mixed-port: 7893
allow-lan: false
mode: rule
log-level: info
ipv6: true
external-controller: '127.0.0.1:9090'
external-ui: ui
external-ui-url: 'https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip'

dns:
  enable: true
  ipv6: true
  listen: 127.0.0.1:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - localhost.ptlogin2.qq.com
    - +.srv.nintendo.net
    - +.stun.playstation.net
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.xboxlive.com
    - msftconnecttest.com
    - 'xbox.*.microsoft.com'
    - '*.battlenet.com.cn'
    - '*.battlenet.com'
    - '*.blzstatic.cn'
    - '*.battle.net'
    - '*.local'
    - '*.localhost'
    - '*.example'
    - '*.invalid'
    - '*.test'
    - '*.localdomain'
    - +.pool.ntp.org
    - 'time.*.apple.com'
    - '*.music.163.com'
    - '*.qq.com'
    - '*.mcdn.bilivideo.cn'
    - +.nflxvideo.net
    - +.tencent.com
    - +.wotgame.cn
    - +.sandai.net
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - 'https://cloudflare-dns.com/dns-query'
    - 'https://dns.google/dns-query'
    - 'https://dns.alidns.com/dns-query'
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - 'Mijia Cloud'
    - +.push.apple.com

tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true

proxies: []

proxy-groups:
  - name: HK
    type: select
    include-all: true
    filter: "🇭🇰"
  - name: JP
    type: select
    include-all: true
    filter: "🇯🇵"
  - name: SG
    type: select
    include-all: true
    filter: "🇸🇬"
  - name: US
    type: select
    include-all: true
    filter: "🇺🇸"
  - name: DE
    type: select
    include-all: true
    filter: "🇩🇪"
  - name: Proxy
    type: select
    proxies:
      - HK
      - JP
      - SG
      - US
      - DE
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png'
  - name: Muse
    type: select
    proxies:
      - US
    icon: 'https://cdn.nodeimage.com/i/p7pQ7DWZNaOmfv8GtHLK47Jr9lurvSWd.webp'
  - name: OpenAi
    type: select
    proxies:
      - Proxy
      - US
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png'
  - name: Telegram
    type: select
    proxies:
      - Proxy
      - HK
      - SG
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png'
  - name: YouTube
    type: select
    proxies:
      - HK
      - JP
      - SG
      - US
      - DE
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png'
  - name: Google
    type: select
    proxies:
      - HK
      - JP
      - SG
      - US
      - DE
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png'
  - name: BiliBili
    type: select
    proxies:
      - DIRECT
      - Proxy
      - HK
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/bilibili.png'
  - name: Microsoft
    type: select
    proxies:
      - DIRECT
      - Proxy
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png'
  - name: Apple
    type: select
    proxies:
      - DIRECT
      - Proxy
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png'
  - name: PayPal
    type: select
    proxies:
      - DIRECT
      - Proxy
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/PayPal.png'
  - name: Final
    type: select
    proxies:
      - Proxy
      - DIRECT
    icon: 'https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png'
